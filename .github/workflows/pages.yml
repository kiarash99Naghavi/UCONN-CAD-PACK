name: Build and deploy the site

# The site is built from what is already committed — the scores in
# outputs/manifest.json, the write-ups, the figures, and the GLB meshes under
# site/assets/meshes/. Regenerating those needs OpenCASCADE and the licensed
# dataset, so it happens locally (tools/make_web_meshes.py, tools/make_site_data.py)
# and CI only renders the pages.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "tools/build_site.py"
      - "docs/**"
      - "handoff/**"
      - "figures/**"
      - "Demo/**"
      - "presentation/**"
      - "outputs/manifest.json"
      - "ARCHITECTURE.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A queued run should deploy the newest commit, but never cancel a deploy that
# is already writing to Pages.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade markdown

      - run: python tools/build_site.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
